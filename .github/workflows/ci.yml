name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Tests (no API key, no network)
        run: pytest -q
      - name: Offline eval (fails if any brief cites a page it never read)
        run: python eval/run_eval.py
      - name: CLI smoke test
        run: python -m wp_brief_agent "cold brew" --offline
      - name: Walkthrough matches the code
        run: |
          python walkthrough/export.py
          python walkthrough/build.py
          git diff --exit-code walkthrough/data.json docs/walkthrough.js
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Google Workspace script tests (fake Sheet, Docs and HTTP)
        run: node --test workspace/test/*.test.js
