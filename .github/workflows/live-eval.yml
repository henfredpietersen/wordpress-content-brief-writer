# Runs the eval against a real model. Started by hand only (Actions tab -> Live eval -> Run
# workflow), never on push, so it only uses API credit or quota when you choose.
# Needs a repository secret for the chosen provider: ANTHROPIC_API_KEY or GROQ_API_KEY.
name: Live eval

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Model API"
        type: choice
        options: [anthropic, groq]
        default: anthropic
      model:
        description: "Model ID (leave blank for the default)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  live-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run live eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_MODEL: ${{ inputs.provider == 'anthropic' && inputs.model || '' }}
          GROQ_MODEL: ${{ inputs.provider == 'groq' && inputs.model || '' }}
        run: >-
          python eval/run_eval.py --live --provider ${{ inputs.provider }}
          --summary-md eval/results/live-${{ inputs.provider }}.md
      - name: Show results on the run page
        if: always()
        run: |
          f="eval/results/live-${{ inputs.provider }}.md"
          if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Save full results (with each brief) as a download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-eval-results-${{ inputs.provider }}
          path: eval/results/
          if-no-files-found: ignore
