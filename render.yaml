# Render Blueprint: deploys the web API on Render's free plan.
# Secrets are never stored here: GROQ_API_KEY / ANTHROPIC_API_KEY are entered in the Render
# dashboard (sync: false), and API_TOKEN is generated by Render (generateValue).
services:
  - type: web
    name: wp-brief-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn wp_brief_agent.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: LLM_PROVIDER
        value: groq
      - key: API_TOKEN
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LIVE_REQUESTS_PER_HOUR
        value: "30"
